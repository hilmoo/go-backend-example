# .goreleaser.yaml
version: 2

project_name: go-backend-example

before:
  hooks:
    - go mod tidy

builds:
  - id: app
    main: ./cmd/main.go
    binary: go-backend-example
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/hilmoo/go-backend-example/internal/app.Version={{.Version}}

dockers_v2:
  - ids: [app]
    images:
      - "ghcr.io/hilmoo/{{ .ProjectName }}"
    tags:
      - "v{{ .Version }}"
      - "latest"
    labels:
      "org.opencontainers.image.description": "My software"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    extra_files:
      - migration

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]